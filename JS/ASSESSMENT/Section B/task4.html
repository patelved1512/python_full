<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Favourite Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        h2 {
            color: #333;
        }

        #loading {
            color: #ff6600;
            font-weight: bold;
        }

        #errorMessage {
            color: red;
        }

        #restaurantList {
            list-style: none;
            padding: 0;
        }

        #restaurantList li {
            padding: 12px;
            margin: 8px 0;
            background: #f0f0f0;
            border-radius: 5px;
            cursor: pointer;
        }

        #restaurantList li:hover {
            background: #e0e0e0;
        }

        #restaurantList li.favourite {
            background: #d8f5d0;
            color: #176b20;
            font-weight: bold;
            border: 2px solid #4caf50;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🍽️ Restaurant Favourite Tracker</h2>

        <p id="loading">Loading restaurants…</p>

        <p id="errorMessage" role="alert"></p>

        <ul id="restaurantList"></ul>

        <p id="favouriteMessage"></p>
    </div>

    <script>
        const restaurantList =
            document.getElementById("restaurantList");

        const loading =
            document.getElementById("loading");

        const errorMessage =
            document.getElementById("errorMessage");

        const favouriteMessage =
            document.getElementById("favouriteMessage");

        const STORAGE_KEY = "favouriteRestaurant";

        async function fetchRestaurants() {
            loading.style.display = "block";
            errorMessage.textContent = "";

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch restaurants");
                }

                const restaurants = await response.json();


                const savedFavourite =
                    localStorage.getItem(STORAGE_KEY);


                restaurants.forEach(function (restaurant) {
                    const li = document.createElement("li");

                    li.textContent = restaurant.name;


                    if (restaurant.name === savedFavourite) {
                        li.classList.add("favourite");
                        favouriteMessage.textContent =
                            "Your favourite: " + restaurant.name;
                    }


                    li.addEventListener("click", function () {
                        localStorage.setItem(
                            STORAGE_KEY,
                            restaurant.name
                        );


                        document
                            .querySelectorAll("#restaurantList li")
                            .forEach(function (item) {
                                item.classList.remove("favourite");
                            });


                        li.classList.add("favourite");

                        favouriteMessage.textContent =
                            "Your favourite: " + restaurant.name;
                    });

                    restaurantList.appendChild(li);
                });

            } catch (error) {
                errorMessage.textContent =
                    "Sorry, restaurants could not be loaded. Please try again.";

                console.error(error);

            } finally {
                loading.style.display = "none";
            }
        }


        fetchRestaurants();
    </script>

</body>

</html>
