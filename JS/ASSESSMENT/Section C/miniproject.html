<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
        }

        header {
            background: #ff5722;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header p {
            margin-top: 8px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 18px;
            background: white;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .nav-btn {
            background: #eee;
        }

        .nav-btn:hover,
        .nav-btn.active {
            background: #ff5722;
            color: white;
        }

        main {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .food-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px #00000012;
        }

        .food-emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .food-card h3 {
            margin-bottom: 10px;
        }

        .food-card p {
            margin: 8px 0;
        }

        .tag {
            display: inline-block;
            padding: 5px 8px;
            background: #e8f5e9;
            color: #218838;
            border-radius: 5px;
            font-size: 12px;
        }

        .nonveg {
            background: #ffebee;
            color: #c62828;
        }

        .add-btn {
            width: 100%;
            margin-top: 12px;
            background: #ff5722;
            color: white;
        }

        .add-btn:hover {
            background: #e64a19;
        }

        .cart-item {
            background: white;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-controls button {
            background: #eee;
            padding: 7px 12px;
        }

        .remove-btn {
            background: #ffdddd;
            color: #b71c1c;
        }

        .total {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .clear-btn {
            background: #d32f2f;
            color: white;
        }

        .restaurant-list {
            margin-top: 30px;
        }

        .restaurant {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .hidden {
            display: none;
        }

        .empty {
            padding: 20px;
            background: white;
            border-radius: 8px;
            color: #666;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: #222;
            color: white;
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 25px;
            }

            nav {
                gap: 8px;
            }

            .nav-btn {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🍔 Foodie Express</h1>
        <p>Delicious food delivered to your doorstep!</p>
        <p>Cart Items: <strong id="cart-count">0</strong></p>
    </header>

    <nav>
        <button class="nav-btn active" onclick="showSection('menu-section', this)">
            Browse Menu
        </button>

        <button class="nav-btn" onclick="showSection('cart-section', this)">
            View Cart
        </button>

        <button class="nav-btn" onclick="clearCart()">
            Clear Cart
        </button>
    </nav>

    <main>

        <!-- Browse Menu Section -->
        <section id="menu-section">
            <h2>🍕 Browse Menu</h2>
            <div class="menu-grid" id="menu-list"></div>

            <div class="restaurant-list">
                <h2>🏪 Restaurant Directory</h2>
                <p>Loading restaurants...</p>
                <div id="restaurant-list"></div>
            </div>
        </section>

        <!-- View Cart Section -->
        <section id="cart-section" class="hidden">
            <h2>🛒 Your Shopping Cart</h2>

            <div id="cart-list"></div>

            <div class="total">
                Total: ₹<span id="cart-total">0</span>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Foodie Express | Mini Project</p>
    </footer>

    <script>
        // 1. Array of dish objects
        const dishes = [
            {
                id: 1,
                name: "Margherita Pizza",
                price: 199,
                category: "Pizza",
                isVegetarian: true,
                emoji: "🍕"
            },
            {
                id: 2,
                name: "Veg Burger",
                price: 99,
                category: "Burger",
                isVegetarian: true,
                emoji: "🍔"
            },
            {
                id: 3,
                name: "Chicken Burger",
                price: 149,
                category: "Burger",
                isVegetarian: false,
                emoji: "🍔"
            },
            {
                id: 4,
                name: "Paneer Tikka",
                price: 179,
                category: "Starter",
                isVegetarian: true,
                emoji: "🥘"
            },
            {
                id: 5,
                name: "Chicken Biryani",
                price: 249,
                category: "Rice",
                isVegetarian: false,
                emoji: "🍛"
            },
            {
                id: 6,
                name: "French Fries",
                price: 79,
                category: "Snacks",
                isVegetarian: true,
                emoji: "🍟"
            },
            {
                id: 7,
                name: "Chocolate Cake",
                price: 119,
                category: "Dessert",
                isVegetarian: true,
                emoji: "🍰"
            },
            {
                id: 8,
                name: "Cold Coffee",
                price: 89,
                category: "Drinks",
                isVegetarian: true,
                emoji: "🥤"
            }
        ];

        // 2. Load the saved cart from LocalStorage
        let cart = [];

        try {
            const savedCart = JSON.parse(
                localStorage.getItem("foodCart") || "[]"
            );

            if (Array.isArray(savedCart)) {
                cart = savedCart.filter(item =>
                    item &&
                    dishes.some(dish => dish.id === item.id) &&
                    Number.isInteger(item.quantity) &&
                    item.quantity > 0
                );
            }
        } catch (error) {
            console.error("Could not load saved cart:", error);
        }

        // 3. Show or hide interface sections
        function showSection(sectionId, button) {
            document.querySelectorAll("main > section")
                .forEach(section => {
                    section.classList.add("hidden");
                });

            document.getElementById(sectionId)
                .classList.remove("hidden");

            document.querySelectorAll(".nav-btn")
                .forEach(btn => {
                    btn.classList.remove("active");
                });

            button.classList.add("active");
        }

        // 4. Render menu cards dynamically
        function renderMenu() {
            const menuList = document.getElementById("menu-list");

            menuList.innerHTML = dishes.map(dish => `
            <div class="food-card">
                <div class="food-emoji">${dish.emoji}</div>

                <h3>${dish.name}</h3>

                <p>Category: ${dish.category}</p>

                <p>
                    <span class="tag ${dish.isVegetarian ? "" : "nonveg"}">
                        ${dish.isVegetarian ? "Vegetarian" : "Non-Vegetarian"}
                    </span>
                </p>

                <p><strong>₹${dish.price}</strong></p>

                <button class="add-btn"
                    onclick="addToCart(${dish.id})">
                    Add to Cart
                </button>
            </div>
        `).join("");
        }

        // 5. Add an item to the cart
        function addToCart(dishId) {
            const dish = dishes.find(item => item.id === dishId);

            if (!dish) return;

            const cartItem = cart.find(item => item.id === dishId);

            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({
                    id: dish.id,
                    quantity: 1
                });
            }

            updateCart();
        }

        // 6. Increase or decrease quantity
        function changeQuantity(dishId, change) {
            const item = cart.find(item => item.id === dishId);

            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                cart = cart.filter(item => item.id !== dishId);
            }

            updateCart();
        }

        // 7. Remove an individual item
        function removeItem(dishId) {
            cart = cart.filter(item => item.id !== dishId);
            updateCart();
        }

        // 8. Clear the entire cart
        function clearCart() {
            cart = [];
            updateCart();

            // Keep the current section visible.
            // If browsing the menu, switch to View Cart.
            if (document.getElementById("menu-section")
                .classList.contains("hidden")) {
                return;
            }

            document.querySelectorAll("main > section")
                .forEach(section => section.classList.add("hidden"));

            document.getElementById("cart-section")
                .classList.remove("hidden");

            document.querySelectorAll(".nav-btn")
                .forEach(btn => btn.classList.remove("active"));

            document.querySelectorAll(".nav-btn")[1]
                .classList.add("active");
        }

        // 9. Save cart and update all visible cart information
        function updateCart() {
            localStorage.setItem("foodCart", JSON.stringify(cart));

            renderCart();
            updateCount();
        }

        // 10. Display total number of items
        function updateCount() {
            const count = cart.reduce(
                (sum, item) => sum + item.quantity, 0
            );

            document.getElementById("cart-count").textContent = count;
        }

        // 11. Render cart items and total price
        function renderCart() {
            const cartList = document.getElementById("cart-list");

            if (cart.length === 0) {
                cartList.innerHTML = `
                <div class="empty">Your cart is empty. Add some food!</div>
            `;

                document.getElementById("cart-total").textContent = "0";
                return;
            }

            cartList.innerHTML = cart.map(item => {
                const dish = dishes.find(d => d.id === item.id);

                if (!dish) return "";

                return `
                <div class="cart-item">
                    <div>
                        <h3>${dish.emoji} ${dish.name}</h3>
                        <p>₹${dish.price} × ${item.quantity}</p>
                        <strong>Subtotal: ₹${dish.price * item.quantity}</strong>
                    </div>

                    <div class="quantity-controls">
                        <button onclick="changeQuantity(${dish.id}, -1)">−</button>
                        <strong>${item.quantity}</strong>
                        <button onclick="changeQuantity(${dish.id}, 1)">+</button>
                        <button class="remove-btn"
                            onclick="removeItem(${dish.id})">
                            Remove
                        </button>
                    </div>
                </div>
            `;
            }).join("");

            const total = cart.reduce((sum, item) => {
                const dish = dishes.find(d => d.id === item.id);
                return sum + (dish ? dish.price * item.quantity : 0);
            }, 0);

            document.getElementById("cart-total").textContent = total;
        }

        // 12. Fetch restaurant data from a public API
        async function loadRestaurants() {
            const restaurantList =
                document.getElementById("restaurant-list");

            try {
                const response = await fetch(
                    "https://restaurant-api.dicoding.dev/list"
                );

                if (!response.ok) {
                    throw new Error("Failed to load restaurants");
                }

                const data = await response.json();

                if (!data.restaurants || data.restaurants.length === 0) {
                    throw new Error("No restaurants available");
                }

                restaurantList.innerHTML = data.restaurants
                    .slice(0, 10)
                    .map(restaurant => `
                    <div class="restaurant">
                        <h3>${restaurant.name}</h3>
                        <p>City: ${restaurant.city}</p>
                        <p>Rating: ${restaurant.rating ?? "N/A"} ⭐</p>
                    </div>
                `).join("");

            } catch (error) {
                restaurantList.innerHTML = `
                <div class="empty">
                    Unable to load restaurants right now.
                    Please check your internet connection and try again.
                </div>
            `;

                console.error("Restaurant API error:", error);
            }
        }


        renderMenu();
        updateCart();
        loadRestaurants();
    </script>

</body>

</html>
