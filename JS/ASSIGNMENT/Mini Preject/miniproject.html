
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Bio Link Builder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            padding: 20px;
            transition: 0.3s;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            padding: 9px 12px;
            margin: 5px 3px;
            cursor: pointer;
        }

        .link-item {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        body.dark-mode {
            background: #181818;
            color: white;
        }

        body.dark-mode .container {
            background: #292929;
        }

        body.dark-mode input {
            background: #444;
            color: white;
        }

        a {
            color: #0879d9;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>My Social Bio Links</h2>

    <button onclick="toggleTheme()">Toggle Light/Dark Mode</button>

    <hr>

    <form id="linkForm">
        <input type="text" id="linkName"
               placeholder="Link name (e.g. Instagram)" required>

        <input type="text" id="linkURL"
               placeholder="URL (https://...)" required>

        <p id="errorMessage" class="error"></p>

        <button type="submit" id="submitButton">Add Link</button>
        <button type="button" onclick="cancelEdit()">Cancel Edit</button>
    </form>

    <h3>My Links</h3>
    <div id="linksList"></div>

</div>

<script>
    // Load saved links from LocalStorage
    let links = JSON.parse(localStorage.getItem("myLinks")) || [];

    // -1 means we are adding a new link
    let editIndex = -1;

    // Save links in LocalStorage
    function saveLinks() {
        localStorage.setItem("myLinks", JSON.stringify(links));
    }

    // Validate URL
    function validateLink(url) {
        return url.startsWith("https://") &&
               url.includes(".") &&
               (
                   url.includes("instagram.com") ||
                   url.includes("spotify.com") ||
                   url.includes("youtube.com")
               );
    }

    // Handle form submission
    document.getElementById("linkForm").addEventListener("submit", function(event) {
        event.preventDefault();

        let name = document.getElementById("linkName").value.trim();
        let url = document.getElementById("linkURL").value.trim();
        let error = document.getElementById("errorMessage");

        if (name === "") {
            error.textContent = "Please enter a link name.";
            return;
        }

        if (!validateLink(url)) {
            error.textContent =
                "Enter a valid HTTPS Instagram, Spotify or YouTube URL.";
            return;
        }

        error.textContent = "";

        let linkObj = {
            name: name,
            url: url
        };

        if (editIndex === -1) {
            manageLink(linkObj, "add");
        } else {
            linkObj.index = editIndex;
            manageLink(linkObj, "edit");
        }

        cancelEdit();
        displayLinks();
    });

    // Reusable function for adding and editing
    function manageLink(linkObj, mode) {
        if (mode === "add") {
            links.push({
                name: linkObj.name,
                url: linkObj.url
            });
        }

        else if (mode === "edit") {
            if (linkObj.index < 0 || linkObj.index >= links.length) {
                return;
            }

            links[linkObj.index] = {
                name: linkObj.name,
                url: linkObj.url
            };
        }

        // One LocalStorage update for both operations
        saveLinks();
    }

    // Display all links
    function displayLinks() {
        let list = document.getElementById("linksList");
        list.innerHTML = "";

        links.forEach(function(link, index) {
            let item = document.createElement("div");
            item.className = "link-item";

            let title = document.createElement("h4");
            title.textContent = link.name;

            let anchor = document.createElement("a");
            anchor.textContent = link.url;
            anchor.href = link.url;
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";

            let editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.addEventListener("click", function() {
                editPlaylistLink(index);
            });

            let deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.addEventListener("click", function() {
                deletePlaylistLink(index);
            });

            item.appendChild(title);
            item.appendChild(anchor);
            item.appendChild(document.createElement("br"));
            item.appendChild(editButton);
            item.appendChild(deleteButton);

            list.appendChild(item);
        });
    }

    // Load selected link into the form for editing
    function editPlaylistLink(index) {
        document.getElementById("linkName").value = links[index].name;
        document.getElementById("linkURL").value = links[index].url;

        editIndex = index;
        document.getElementById("submitButton").textContent = "Update Link";
        document.getElementById("errorMessage").textContent = "";
    }

    // Delete a link
    function deletePlaylistLink(index) {
        links.splice(index, 1);
        saveLinks();

        if (editIndex === index) {
            cancelEdit();
        } else if (editIndex > index) {
            editIndex--;
        }

        displayLinks();
    }

    // Reset the form after adding or editing
    function cancelEdit() {
        document.getElementById("linkForm").reset();
        document.getElementById("errorMessage").textContent = "";
        document.getElementById("submitButton").textContent = "Add Link";
        editIndex = -1;
    }

    // Light and dark mode
    function toggleTheme() {
        document.body.classList.toggle("dark-mode");

        let theme = document.body.classList.contains("dark-mode")
            ? "dark"
            : "light";

        localStorage.setItem("theme", theme);
    }

    // Apply saved theme on page load
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
    }

    // Show saved links when page opens
    displayLinks();
</script>

</body>
</html>
