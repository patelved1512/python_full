<!DOCTYPE html>
<html>
<body>

    <input type="text" id="color" placeholder="Enter a color">

    <div id="moodbox"
         style="width:200px; height:100px; border:1px solid black;">
    </div>

    <script>
        document.getElementById("color").addEventListener("input", function() {
            let color = document.getElementById("color").value;

            document.getElementById("moodbox").style.backgroundColor = color;
        });
    </script>

</body>
</html>
