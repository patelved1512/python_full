<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Cart</title>
</head>
<body>

    <h2>Flipkart Shopping Cart</h2>

    <script>
        let cart = [
            { productName: "Shoes", price: 1500, quantity: 2 },
            { productName: "Watch", price: 1000, quantity: 1 },
            { productName: "Headphones", price: 800, quantity: 3 },
            { productName: "Bag", price: 1200, quantity: 2 }
        ];

        for (let i = 0; i < cart.length; i++) {
            let total = cart[i].price * cart[i].quantity;

            console.log("Product:", cart[i].productName);
            console.log("Total Price:", total);
        }
    </script>

</body>
</html>
