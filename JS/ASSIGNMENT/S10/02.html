<!DOCTYPE html>
<html>
<head>
    <title>Welcome Message</title>
</head>
<body>

    <h2>Welcome Message</h2>

    <script>
        function formatWelcomeMessage(userName, followers) {
            return `Hello ${userName}, you have ${followers} followers!`;
        }

        let message = formatWelcomeMessage("Badal", 1200);

        console.log(message);
    </script>

</body>
</html>
