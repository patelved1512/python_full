<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <script>
        
function formatFollowers(count) {
    try {
        if (count < 0) {
            throw new Error("Negative count");
        }

        return count + " followers";
    } catch (error) {
        return error.message;
    }
}

console.log(formatFollowers(100));
console.log(formatFollowers(-5));

    </script>
</body>
</html>
