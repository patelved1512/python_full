<!-- Splitting utility functions into separate files using imports and exports makes a Zomato-like app easier to maintain as it grows from 2 to 20 features. Each file can handle a specific task, such as restaurant searches, payments, cart management, or order tracking. For example, a priceUtils.js file can contain reusable functions for calculating food prices and discounts, which can be imported into both the cart and checkout features. This reduces duplicate code, makes testing easier, and allows developers to update one feature without unnecessarily changing others. -->
