<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effect</title>

    <style>
        .main {
            height: 100px;
            width: 100px;
            border: 2px solid;
            position: relative;
        }

        .demo {
            height: 100%;
            width: 100%;
            background-color: aquamarine;

            /* Start from center */
            transform: scale(0);

            /* Smooth animation */
            transition: transform 0.5s ease;
        }

        /* Hover main → expand demo */
        .main:hover .demo {
            transform: scale(1);
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="demo"></div>
    </div>

</body>
</html>
