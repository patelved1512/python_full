<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            height: 100px;
            width: 100px;
            border: 2px solid;
            position: relative;
        }

        .demo {
            height: 100px;
            width: 100px;
            background-color: rgba(9, 227, 154, 0.209);
            transform: scale(0);
            transition-duration: 1s;
        }

        .main:hover .demo {
            transform: scale(1);
        }

        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <div class="main"><span class="text">Hello</span>
        <div class="demo"></div>
    </div>
</body>

</html>
