<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style: none;
        }
        ul li {
            display: inline-block;
            background-color: rgb(116, 185, 118);
            padding: 10px 20px;
            position: relative;
        }
        ul li::before{
            content: "";
            height: 5px;
            width: 0;
            background-color: black;
            position: absolute;
            bottom: 100%;
            left: 0;
            /* transform: scaleX(0); */
            transition: .6s;
        }
        li:hover::before{
            /* transform: scaleX(1); */
            width: 100%;
        }
        ul li::after{
            content: "";
            height: 5px;
            width: 0;
            background-color: black;
            position: absolute;
            top: 100%;
            right: 0;
            /* transform: scaleX(0); */
            transition: .6s;
        }
        li:hover::after{
            /* transform: scaleX(1); */
            width: 100%;
        }
        ul li a{
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>
    
    <ul>
        <li><a href="">Home</a></li>
        <li><a href="">About</a></li>
        <li><a href="">Contact</a></li>
        <li><a href="">Help</a></li>
        <li><a href="">test</a></li>
    </ul>


</body>
</html>
